<!DOCTYPE html>
<html>
<head>
    <title>Daily News</title>

    <style>
        body {
            font-family: Arial;
            margin: 20px;
            background-color: lightgray;
        }

        header {
            background-color: black;
            color: white;
            text-align: center;
            padding: 20px;
        }

        .container {
            display: grid;
            grid-template-columns: 1fr 2fr 1fr;
            gap: 15px;
            margin-top: 20px;
        }

        .box {
            background-color: white;
            padding: 15px;
        }

        h2 {
            color: blue;
        }

        @media (max-width: 600px) {
            .container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>Daily News</h1>
        <p>Your Daily Newspaper</p>
    </header>

    <div class="container">

        <div class="box">
            <h2>Sports</h2>
            <p>Latest sports news and updates.</p>
        </div>

        <div class="box">
            <h2>Main News</h2>
            <p>Latest national and international news.</p>
        </div>

        <div class="box">
            <h2>Technology</h2>
            <p>New technology and inventions.</p>
        </div>

    </div>

</body>
</html>
