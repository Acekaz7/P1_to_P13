
<!DOCTYPE html>
<html>
<head>
    <title>Flexbox Layout</title>
    <style>
        body { font-family: Arial; background: lightgray; }
        nav { display: flex; justify-content: space-around; background: black; padding: 15px; }
        nav a { color: white; }
        .container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            padding: 20px;
        }
        .card { background: white; width: 200px; padding: 20px; text-align: center; }
        @media(max-width: 600px) {
            nav, .container { flex-direction: column; align-items: center; }
            nav { gap: 10px; }
        }
    </style>
</head>
<body>
    <nav>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Contact</a>
    </nav>
    <div class="container">
        <div class="card"><h3>Card 1</h3><p>First card</p></div>
        <div class="card"><h3>Card 2</h3><p>Second card</p></div>
        <div class="card"><h3>Card 3</h3><p>Third card</p></div>
    </div>
</body>
</html>
