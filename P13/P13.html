<!DOCTYPE html>
<html>
<head>
    <title>Flexbox and Grid</title>

    <style>
        body {
            font-family: Arial;
            background-color: lightgray;
        }

        header {
            background-color: black;
            color: white;
            padding: 15px;
            display: flex;
            justify-content: space-between;
        }

        nav {
            display: flex;
            gap: 15px;
        }

        nav a {
            color: white;
            text-decoration: none;
        }

        .container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            padding: 20px;
        }

        .card {
            background-color: white;
            padding: 30px;
            text-align: center;
        }
    </style>
</head>

<body>

    <header>
        <h2>My Website</h2>

        <nav>
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Contact</a>
        </nav>
    </header>

    <div class="container">
        <div class="card">Card 1</div>
        <div class="card">Card 2</div>
        <div class="card">Card 3</div>
    </div>

</body>
</html>
