<!DOCTYPE html>
<html>
<head>
    <title>Typography System</title>

    <style>
        body {
            background-color: lightgray;
            font-family: Arial;
            margin: 20px;
        }

        h1 {
            color: blue;
            font-size: 32px;
        }

        h2 {
            color: green;
            font-size: 24px;
        }

        p {
            color: black;
            font-size: 18px;
            line-height: 1.5;
        }

        button {
            background-color: blue;
            color: white;
            padding: 10px;
            border: none;
        }
    </style>
</head>

<body>

    <h1>My Website</h1>
    <h2>About Us</h2>
    <p>Welcome to my website.</p>
    <button>Click Me</button>

</body>
</html>
