
<!DOCTYPE html>
<html>
<head>
    <title>My Projects</title>
    <style>
        body { background: lightgray; margin: 20px; }
        h1 { text-align: center; }
        .container { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
        .card { background: white; padding: 20px; text-align: center; border: 1px solid gray; }
        img { width: 100%; height: 150px; }
        button { background: blue; color: white; padding: 10px; }
        @media(max-width: 700px) { .container { grid-template-columns: repeat(2, 1fr); } }
        @media(max-width: 450px) { .container { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <h1>My Projects</h1>
    <div class="container">
        <div class="card">
            <img src="https://via.placeholder.com/200" alt="Project 1">
            <h3>Portfolio Website</h3>
            <p>Created using HTML and CSS.</p>
            <button>View Project</button>
        </div>
        <div class="card">
            <img src="https://via.placeholder.com/200" alt="Project 2">
            <h3>Student Dashboard</h3>
            <p>A simple student dashboard.</p>
            <button>View Project</button>
        </div>
        <div class="card">
            <img src="https://via.placeholder.com/200" alt="Project 3">
            <h3>College Website</h3>
            <p>A college information website.</p>
            <button>View Project</button>
        </div>
    </div>
</body>
</html>
